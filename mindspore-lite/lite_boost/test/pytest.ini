[pytest]
# Markers used by the lite_boost test suite. Mirrors mindspore's st/pytest.ini
# convention. The hardware marks (ascend_300iduo / ascend_a2) are selected by
# CI via `pytest -m` (see run.sh's pytest_mark_expr) so each board runs only its
# own cases:
#   Atlas 300I Duo (ascend310p):  -m "ascend_300iduo"
#   Atlas 800I A2   (ascend910b): -m "ascend_a2"
# and combined with the level filter, e.g.  -m "L0 and ascend_300iduo".
markers =
    L0: level-0 case (basic verification, PR gate)
    L1: level-1 case (full verification, nightly gate)
    ascend_300iduo: case for Atlas 300I Duo (ascend310p)
    ascend_a2: case for Atlas 800I A2 (ascend910b)
