# Conversion config of the Qwen3-VL-Embedding-2B text-image chunk.
#
# Inputs (batch is pinned to 1, only the sequence length stays dynamic):
#   input_ids:      [1, seq_len]
#   attention_mask: [1, seq_len]
#   position_ids:   [3, 1, seq_len]   temporal / height / width mrope rows
#   image_embeds:   [1024, 2048]      vision chunk output
#   ds0/ds1/ds2:    [1024, 2048]      vision chunk deepstack outputs
# 1024 merged tokens = 64 x 64 patch grid = a 1024 x 1024 image, so these shapes must
# match `--vision-image-size` used by `export_qwen3_vl_embedding_image_onnx.py` (1024 by
# default); the exported model does not accept any other row count.
#
# `ge.dynamicDims` holds the shape buckets, one bucket per line and one value per `-1`
# dimension of `input_shape`, in input order: the sequence lengths of input_ids /
# attention_mask / position_ids. The buckets must cover the sequence lengths used at
# runtime; the sequence length of a 1024 x 1024 image plus its prompt is around 1100,
# so the 2048 bucket is the one normally taken.
[acl_build_options]
input_format="ND"
input_shape="input_ids:1,-1;attention_mask:1,-1;position_ids:3,1,-1;image_embeds:1024,2048;ds0:1024,2048;ds1:1024,2048;ds2:1024,2048"
ge.dynamicDims="128,128,128;512,512,512;1024,1024,1024;2048,2048,2048;4096,4096,4096"

[acl_init_options]
ge.exec.precision_mode=allow_mix_precision
ge.exec.modify_mixlist="configs/op_fp32.json"

[ascend_context]
plugin_custom_ops=All
