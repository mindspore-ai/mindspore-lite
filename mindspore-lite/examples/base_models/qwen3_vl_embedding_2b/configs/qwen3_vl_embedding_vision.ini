# Conversion config of the Qwen3-VL-Embedding-2B vision chunk.
#
# The exported vision model has a single fully static input:
#   pixel_values: [4096, 1536]
# where 1536 = in_channels * temporal_patch_size * patch_size * patch_size and
# 4096 patches = 64 x 64 grid = a 1024 x 1024 image, i.e. `--vision-image-size 1024`
# (the default of `export_qwen3_vl_embedding_image_onnx.py`). 1024 x 1024 gives
# 1024 merged image tokens (spatial_merge_size 2), which is what the text-image chunk
# consumes.
#
# The learned position embedding and the vision rotary tables are baked into the graph,
# so the patch count is fixed at export time: when another `--vision-image-size` is used,
# re-export the model and update `input_shape` below, then pass the matching `--image-size`
# to `infer_qwen3_vl_embedding_mslite.py`.
[acl_build_options]
input_format="ND"
input_shape="pixel_values:4096,1536"

[acl_init_options]
ge.exec.precision_mode=allow_mix_precision

[ascend_context]
plugin_custom_ops=All
