[acl_init_options]
# The closing RMSNorm is exported as an fp32 region (Cast -> Pow -> ReduceMean -> rsqrt -> Mul),
# and its input carries the last layer's outliers: |h| reaches 282 on this checkpoint, so h^2 =
# 79524 overflows fp16 (max 65504) and every such token's variance becomes inf. GE's default
# allow_fp32_to_fp16 turns the region fp16 and costs the graph ~2e-2 cosine on the hidden states;
# must_keep_origin_dtype keeps the exported fp32 ops in fp32 (the fp16 matmuls and the
# ChunkGatedDeltaRule nodes stay fp16, so this is not the same as force_fp32) and restores 0.999997.
ge.exec.precision_mode=must_keep_origin_dtype

[acl_build_options]
input_format="ND"
input_shape="input_ids:1,-1;position_ids:1,-1;attention_mask:1,1,-1,-1;past_conv_states:24,1,8192,4;past_recurrent_states:24,1,32,128,128;past_kv_cache:16,1,4,-1,256"
