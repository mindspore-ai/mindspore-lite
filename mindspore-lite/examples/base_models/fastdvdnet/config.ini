[acl_build_options]
input_format="ND"
# FastDVDnet 输入: seq [1,5,3,256,256] (5帧RGB) + noise_sigma [1,1]。
# 如需其他分辨率: 同步 export 的 --height/--width 与此处 input_shape 后重转。
input_shape="seq:1,5,3,256,256;noise_sigma:1,1"

[acl_init_options]
# 默认 fp16; 仅当去噪输出异常时改 force_fp32 重转。
ge.exec.precision_mode=force_fp16

[ascend_context]
plugin_custom_ops=All
