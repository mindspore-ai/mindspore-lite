[acl_build_options]
input_format="ND"
# CAIN 输入: 两帧 img0/img1, 各 [1,3,H,W]。默认固定 256x256(须可被 2^(depth+1) 整除)。
# 如需其他分辨率: 调整 export 的 --height/--width 并同步此处的 input_shape, 重新转换。
input_shape="img0:1,3,256,256;img1:1,3,256,256"

[acl_init_options]
# 默认 fp16; 仅当 MSLite 推理输出溢出/全零/常数时, 改为 force_fp32 并重转。
ge.exec.precision_mode=force_fp16

[ascend_context]
plugin_custom_ops=All
