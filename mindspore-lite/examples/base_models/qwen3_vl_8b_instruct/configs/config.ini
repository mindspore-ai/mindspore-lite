[acl_init_options]
# allow_fp32_to_fp16: keep weights/compute in fp16, allow fp32 fallback where needed.
# force_fp32 inflates the prefill/decode OM beyond 44GB on Atlas 300I Duo and OOMs (ret=500002)
# on aclmdlLoadFromMem — even with one sub-model per card. fp16 fits (~31GB runtime).
ge.exec.precision_mode = allow_fp32_to_fp16
