[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mslite-llm"
dynamic = ["version"]
description = "MindSpore Lite on-device LLM export toolchain (HF/GGUF -> single-file .msl)"
requires-python = ">=3.9"
# transformers >= 4.57: the GGUF skeleton path uses the 4.57 ``gguf_file=``
# kwarg.  The forward logic lives in standalone NNRT wrappers (``models/_base``
# + per-model subclasses) that only touch stable public transformers APIs
# (AutoModelForCausalLM / AutoConfig / submodule attribute refs), so there is
# no monkey-patch coupling to a single transformers minor anymore.
dependencies = [
    "mslite_llm_ops==0.1.0",
    "torch>=2.0",
    "transformers>=4.57,<5",
    "onnx>=1.16",
    "onnxslim>=0.1.96",
    "gguf==0.17.1",
    "numpy",
    "safetensors",
    "tqdm",
    "accelerate",
]

[project.scripts]
mslite-llm-export = "mslite_llm_export:main"

[tool.setuptools]
packages = [
    "utils",
    "models",
    "models._base",
    "models.qwen2_5",
    "models.qwen3",
    "models.minicpm",
]
py-modules = ["mslite_llm_export"]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.dynamic]
version = {file = ["version.txt"]}
