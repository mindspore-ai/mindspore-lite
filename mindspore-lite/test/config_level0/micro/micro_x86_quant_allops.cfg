[micro_param]
enable_micro=true
target=x86
support_parallel=false

[common_quant_param]
quant_type=FULL_QUANT
bit_num=8

[data_preprocess_param]
# calibrate_path is filled per-model by run_benchmark_codegen.sh (Run_quant_codegen)
# from input_output/input/<model>.ms.bin[_1.._N]
calibrate_path=
calibrate_size=1
input_type=BIN

[full_quant_param]
# enable_all_ops widens the FULL_QUANT whitelist beyond conv/fc/matmul to arithmetic ops
# (AddFusion/Eltwise/...). Without it a broadcast Add never quantizes and regressions like
# #43523 (AddBroadcastInt8Run fed general broadcast shapes) stay invisible to this suite.
activation_quant_method=MAX_MIN
bias_correction=true
enable_all_ops=true
