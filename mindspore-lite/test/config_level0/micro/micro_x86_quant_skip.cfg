[common_quant_param]
# FULL_QUANT + per-layer origin-domain blacklist (fusion-tracing feature):
#   skip_quant_op_type=CONV_2D keeps every conv in fp32 (mnist is a conv net, so the
#     entry must hit and the report must show SKIP_OP_TYPE on conv rows);
#   skip_quant_node=MAX_POOL_2D-0 (a plausible name copied from the TF mnist tutorial, but this net uses AvgPool) must NOT hit and must surface as a CONFIG_UNMATCHED
#     status row (plus a warning) instead of silently failing;
#   layer_decision_report enables the 12-column layer decision report (calibrate_path
#     is filled per-model by run_benchmark_codegen.sh Run_quant_codegen).
quant_type=FULL_QUANT
bit_num=8
skip_quant_op_type=CONV_2D
skip_quant_node=MAX_POOL_2D-0
layer_decision_report=./layer_decision.csv

[data_preprocess_param]

calibrate_path=

calibrate_size=1

input_type=BIN

[full_quant_param]

activation_quant_method=MAX_MIN

bias_correction=false


[micro_param]
enable_micro=true
target=x86
codegen_mode=Inference
support_parallel=false
debug_mode=false
