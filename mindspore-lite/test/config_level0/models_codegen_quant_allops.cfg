# Guard cases for issue #43523 (hispark x86 micro FULL_QUANT + enable_all_ops).
# sum broadcast shapes: the AddInt8Coder serial/parallel broadcast path must tile
# general broadcast shapes (AddBroadcastInt8Run only handles the bias-add pattern);
# constantofshape: an Int64 graph input must not break MSModelBuild/Predict
# (EnumNameMSDataType Int64 mapping). Requires micro_x86_quant_allops.cfg
# (enable_all_ops=true), otherwise the Adds never quantize and nothing is guarded.
sum_onnx_bc_2x3x4x5_2x1x1x1.onnx;2:input_0,input_1 0.95 NCHW
sum_onnx_bc_4x1_1x8.onnx;2:input_0,input_1 0.95
sum_onnx_same_2x3.onnx;2:input_0,input_1 0.95
constantofshape_onnx_val1.onnx;1:shape 0.99
